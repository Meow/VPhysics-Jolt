name: Build Dev

on: [push, workflow_dispatch]

jobs:
  linux-gmod-dedicated:
    runs-on: ubuntu-latest
    name: "GMod Dedicated Server"
    env:
        PTERODACTYL_SERVER: ${{ secrets.PTERODACTYL_SERVER }}
    steps:
    - name: Checkout VPhysics Jolt
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build
      run: ./build.sh linux32

    - name: Create zip file
      run: |
        cd dist/gmod-linux32-srv
        zip -r ../../vphysics_jolt_gmod_dedicated_linux32.zip bin

    # RaphaelIT7: GLuaTest setup - we replace vphysics in the bin/ folder
    - name: Create GLuaTest file
      run: |
        cd dist/gmod-linux32-srv
        tar -czf ../../vphysics_jolt_gmod_gluatest.tar.gz bin/

    # RaphaelIT7: I use pterodactyl for testing, though it's not required for any forks / will not run for them.
    - name: Deploy to pterodactyl
      if: env.PTERODACTYL_SERVER != ''
      run: |
        curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/files/write?file=%2Fvphysics_jolt_gmod_dedicated_linux32.zip" \
              -H 'Accept: application/json' \
              -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
              -X POST \
              --data-binary '@vphysics_jolt_gmod_dedicated_linux32.zip'

        curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/files/decompress" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
              -X POST \
              -d '{"root": "/", "file": "vphysics_jolt_gmod_dedicated_linux32.zip"}' 

    - uses: actions/upload-artifact@v4
      name: "Upload GLuaTest build"
      with:
        name: vphysics_jolt_gmod_gluatest
        path: vphysics_jolt_gmod_gluatest.tar.gz
        compression-level: 9
        retention-days: 1

    # holylib_v2 - This build should not depend on exact return float values.
  tests:
    name: "Test 32x branches"
    needs: linux-gmod-dedicated
    uses: RaphaelIT7/GLuaTest/.github/workflows/run_tests.yml@holylib_v2
    strategy:
      matrix:
        branch:
          - public
          - dev
          - prerelease
    with:
      download-artifact: "vphysics_jolt_gmod_gluatest"
      no-checkout: "true"
      branch: ${{ matrix.branch }}
      timeout: "4"