name: Build Artifacts

on: [push, pull_request, workflow_dispatch, workflow_call]

jobs:
  # Garry's Mod: CMake + Docker (see build.sh)
  gmod:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux32
            packages: gmod-linux32 gmod-linux32-srv
          - target: linux64
            packages: gmod-linux64 gmod-linux64-client
          - target: win32
            packages: gmod-win32
          - target: win64
            packages: gmod-win64

    runs-on: ubuntu-latest
    name: gmod ${{ matrix.target }}

    steps:
    - name: Checkout VPhysics Jolt
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build
      run: ./build.sh ${{ matrix.target }}

    - name: Package
      run: |
        for package in ${{ matrix.packages }}; do
          (cd "dist/$package" && zip -qr "../../vphysics_jolt_$package.zip" .)
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vphysics_jolt_${{ matrix.target }}
        path: vphysics_jolt_*.zip
        if-no-files-found: error

  # Source SDK 2013 and Alien Swarm: VPC
  windows:
    strategy:
      fail-fast: false
      matrix:
        branch: [sdk2013-sp, sdk2013-mp, asw]

    runs-on: windows-2022
    name: ${{ matrix.branch }} win32

    steps:
    - name: Checkout Mini Source SDK
      uses: actions/checkout@v4
      with:
        repository: RaphaelIT7/mini-source-sdk
        ref: gmod-changes

    - name: Checkout VPhysics Jolt
      uses: actions/checkout@v4
      with:
        path: ${{ matrix.branch }}/src/vphysics_jolt
        submodules: recursive

    - name: Find Visual Studio
      run: |
        $installationPath = Get-VSSetupInstance `
          | Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest `
          | Select-Object -ExpandProperty InstallationPath
        Write-Output "VSDEVCMD=${installationPath}\Common7\Tools\VsDevCmd.bat" `
          | Out-File -FilePath "${Env:GITHUB_ENV}" -Append

    - name: Build MSVC x86
      working-directory: ${{ matrix.branch }}/src
      run: |
        & "${Env:COMSPEC}" /s /c "`"${Env:VSDEVCMD}`" -arch=x86 -host_arch=x64 -no_logo && set" `
          | % { , ($_ -Split '=', 2) } `
          | % { [System.Environment]::SetEnvironmentVariable($_[0], $_[1]) }
        if (Test-Path ".\fix_registry.bat") {
          & ".\fix_registry.bat"
        }
        .\createjoltprojects.bat 32
        devenv jolt.sln /upgrade
        msbuild jolt.sln /nodeReuse:false /t:Rebuild /p:Configuration=Release /p:Platform=x86 /m /v:minimal

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vphysics_jolt_${{ matrix.branch }}_win32
        path: ${{ matrix.branch }}/game
        if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        branch: [sdk2013-sp, sdk2013-mp]

    runs-on: ubuntu-latest
    name: ${{ matrix.branch }} linux32
    # Jolt needs GCC 11 or newer
    container: debian:bookworm

    steps:
    - name: Install Dependencies
      run: |
        dpkg --add-architecture i386
        apt-get update
        apt-get install -y build-essential git libstdc++6:i386 gcc-multilib g++-multilib

    - name: Checkout Mini Source SDK
      uses: actions/checkout@v4
      with:
        repository: RaphaelIT7/mini-source-sdk
        ref: gmod-changes

    - name: Checkout VPhysics Jolt
      uses: actions/checkout@v4
      with:
        path: ${{ matrix.branch }}/src/vphysics_jolt
        submodules: recursive

    - name: Build GCC x86
      working-directory: ${{ matrix.branch }}/src
      run: |
        chmod +x createjoltprojects.sh devtools/bin/vpc devtools/gendbg.sh
        if [ -f "devtools/bin/vpc_linux" ]; then
          chmod +x devtools/bin/vpc_linux
        fi
        ./createjoltprojects.sh 32
        make -f jolt.mak -j $(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vphysics_jolt_${{ matrix.branch }}_linux32
        path: ${{ matrix.branch }}/game
        if-no-files-found: error
