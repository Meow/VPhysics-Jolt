name: Build Release

on: [workflow_dispatch]

jobs:
  build:
    uses: ./.github/workflows/artifacts.yml

  release:
    name: Create Draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Package
      run: |
        mkdir release
        # The GMod artifacts are already zipped
        find artifacts -name 'vphysics_jolt_*.zip' -exec mv {} release/ \;
        # The VPC artifacts are game directories
        for dir in artifacts/vphysics_jolt_sdk2013-* artifacts/vphysics_jolt_asw_*; do
          [ -d "$dir" ] || continue
          (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/$(basename "$dir").zip" .)
        done
        ls -la release

    - name: Create draft release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.run_number }}" release/*.zip \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "Build ${{ github.run_number }}" \
          --draft
